<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunday Forever — Spoiler-Free Replay</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent2: #58a6ff;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 14px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  header .sub {
    color: var(--muted);
    font-size: 0.85rem;
  }
  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.9rem;
    margin-top: 8px;
  }
  .status-banner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: var(--muted);
  }
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 12px;
    margin-bottom: 14px;
  }
  .team {
    text-align: center;
    overflow: hidden;
  }
  .team .name {
    font-size: 0.95rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team .score {
    font-size: 2.1rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .vs {
    color: var(--muted);
    font-size: 0.8rem;
    padding: 0 4px;
  }
  .timeline-block {
    margin-bottom: 16px;
  }
  input[type="range"].scrubber {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    background: transparent;
    accent-color: var(--accent2);
    cursor: pointer;
    touch-action: pan-x;
  }
  input[type="range"].scrubber::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 999px;
    background: var(--border);
  }
  input[type="range"].scrubber::-moz-range-track {
    height: 8px;
    border-radius: 999px;
    background: var(--border);
  }
  input[type="range"].scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--accent2);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent2);
  }
  input[type="range"].scrubber::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent2);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent2);
  }
  .timeline-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 14px 0 22px;
  }
  button.ctrl {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.95rem;
    cursor: pointer;
    min-width: 64px;
  }
  button.ctrl:active { transform: scale(0.97); }
  button.ctrl.play { background: var(--accent); border-color: var(--accent); color: #04240f; font-weight: 700; }
  button.ctrl.play.playing { background: var(--danger); border-color: var(--danger); color: #2b0705; }
  button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
  .speed-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
  }
  .speed-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .speed-btn.active {
    color: var(--accent2);
    border-color: var(--accent2);
  }
  .lineups {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 480px) {
    .lineups { grid-template-columns: 1fr; }
    .team .score { font-size: 1.6rem; }
  }
  .lineup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  .lineup-card h3 {
    font-size: 0.85rem;
    margin: 0 0 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  table.lineup {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  table.lineup td {
    padding: 5px 2px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.lineup tr:last-child td { border-bottom: none; }
  .slot {
    color: var(--muted);
    width: 34px;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .pname {
    font-weight: 500;
  }
  .pmeta {
    color: var(--muted);
    font-size: 0.7rem;
  }
  .ppts {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    white-space: nowrap;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
    margin-top: 30px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏈 Sunday Forever — Replay</h1>
    <div class="sub">Watch your matchup unfold like it's live. No spoilers — ever.</div>
    <div id="weekSelectWrap" class="hidden">
      <select id="weekSelect"></select>
    </div>
  </header>

  <div id="loading" class="status-banner">Loading...</div>
  <div id="noData" class="status-banner hidden"></div>

  <div id="content" class="hidden">
    <div class="scoreboard">
      <div class="team">
        <div class="name" id="myName">—</div>
        <div class="score" id="myScore">0.0</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <div class="name" id="oppName">—</div>
        <div class="score" id="oppScore">0.0</div>
      </div>
    </div>

    <div class="timeline-block">
      <input type="range" class="scrubber" id="scrubber" min="0" max="0" step="1" value="0">
      <div class="timeline-meta">
        <span id="posLabel">Snapshot 1</span>
        <span id="timeLabel">--</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl play" id="btnPlay">▶ Play</button>
    </div>
    <div class="speed-row">
      <button class="speed-btn" data-speed="2000">Slow</button>
      <button class="speed-btn active" data-speed="900">Normal</button>
      <button class="speed-btn" data-speed="350">Fast</button>
    </div>

    <div class="lineups">
      <div class="lineup-card">
        <h3 id="myLineupTitle">My Lineup</h3>
        <table class="lineup"><tbody id="myLineupBody"></tbody></table>
      </div>
      <div class="lineup-card">
        <h3 id="oppLineupTitle">Opponent</h3>
        <table class="lineup"><tbody id="oppLineupBody"></tbody></table>
      </div>
    </div>
  </div>

  <footer>Data via the public Sleeper API · updated automatically every ~10 min during game windows</footer>
</div>

<script>
(function () {
  "use strict";

  var state = {
    current: null,
    week: null,
    snapshots: [],
    index: 0,          // furthest point the user has actually reached
    playing: false,
    speed: 900,
    timer: null,
  };

  var el = {
    loading: document.getElementById("loading"),
    noData: document.getElementById("noData"),
    content: document.getElementById("content"),
    weekSelectWrap: document.getElementById("weekSelectWrap"),
    weekSelect: document.getElementById("weekSelect"),
    myName: document.getElementById("myName"),
    oppName: document.getElementById("oppName"),
    myScore: document.getElementById("myScore"),
    oppScore: document.getElementById("oppScore"),
    scrubber: document.getElementById("scrubber"),
    posLabel: document.getElementById("posLabel"),
    timeLabel: document.getElementById("timeLabel"),
    btnPlay: document.getElementById("btnPlay"),
    myLineupTitle: document.getElementById("myLineupTitle"),
    oppLineupTitle: document.getElementById("oppLineupTitle"),
    myLineupBody: document.getElementById("myLineupBody"),
    oppLineupBody: document.getElementById("oppLineupBody"),
  };

  function fetchJSON(url) {
    return fetch(url + "?_=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
      return r.json();
    });
  }

  function fmtPts(n) {
    return (Math.round((n || 0) * 100) / 100).toFixed(2);
  }

  function fmtTime(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString(undefined, {
        weekday: "short", hour: "numeric", minute: "2-digit"
      });
    } catch (e) {
      return iso;
    }
  }

  function fmtElapsed(snap) {
    var first = state.snapshots[0];
    if (!first) return "";
    var ms = new Date(snap.timestamp) - new Date(first.timestamp);
    var mins = Math.max(0, Math.round(ms / 60000));
    if (mins < 60) return mins + " min in";
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + "h " + m + "m in";
  }

  function renderLineup(tbody, lineup) {
    tbody.innerHTML = "";
    lineup.forEach(function (p) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="slot">' + p.slot + '</td>' +
        '<td><div class="pname">' + escapeHtml(p.name) + '</div>' +
        '<div class="pmeta">' + escapeHtml([p.position, p.team].filter(Boolean).join(" · ")) + '</div></td>' +
        '<td class="ppts">' + fmtPts(p.points) + '</td>';
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    var snap = state.snapshots[state.index];
    if (!snap) return;

    el.myName.textContent = snap.my.team_name;
    el.oppName.textContent = snap.opp.team_name;
    el.myScore.textContent = fmtPts(snap.my.points);
    el.oppScore.textContent = fmtPts(snap.opp.points);
    el.myLineupTitle.textContent = snap.my.team_name;
    el.oppLineupTitle.textContent = snap.opp.team_name;
    renderLineup(el.myLineupBody, snap.my.lineup);
    renderLineup(el.oppLineupBody, snap.opp.lineup);

    el.scrubber.max = Math.max(0, state.snapshots.length - 1);
    el.scrubber.value = state.index;
    el.posLabel.textContent = "Snapshot " + (state.index + 1) + " of " + state.snapshots.length;
    el.timeLabel.textContent = fmtTime(snap.timestamp) + " · " + fmtElapsed(snap);

    if (state.index >= state.snapshots.length - 1) {
      stopPlaying();
    }
  }

  function step(delta) {
    var next = state.index + delta;
    if (next < 0 || next >= state.snapshots.length) return;
    state.index = next;
    render();
  }

  function startPlaying() {
    if (state.snapshots.length === 0 || state.index >= state.snapshots.length - 1) return;
    state.playing = true;
    el.btnPlay.textContent = "⏸ Pause";
    el.btnPlay.classList.add("playing");
    clearInterval(state.timer);
    state.timer = setInterval(function () {
      if (state.index >= state.snapshots.length - 1) {
        stopPlaying();
        return;
      }
      step(1);
    }, state.speed);
  }

  function stopPlaying() {
    state.playing = false;
    el.btnPlay.textContent = "▶ Play";
    el.btnPlay.classList.remove("playing");
    clearInterval(state.timer);
    state.timer = null;
  }

  function togglePlay() {
    if (state.playing) stopPlaying(); else startPlaying();
  }

  el.btnPlay.addEventListener("click", togglePlay);

  el.scrubber.addEventListener("input", function () {
    stopPlaying();
    var v = parseInt(el.scrubber.value, 10);
    if (v < 0 || v >= state.snapshots.length) return;
    state.index = v;
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".speed-btn"), function (btn) {
    btn.addEventListener("click", function () {
      state.speed = parseInt(btn.getAttribute("data-speed"), 10);
      document.querySelectorAll(".speed-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      if (state.playing) { startPlaying(); }
    });
  });

  function loadWeek(week) {
    stopPlaying();
    state.week = week;
    var meta = state.current.weeks[String(week)];
    var file = meta ? meta.file : ("data/snapshots_week" + week + ".json");
    fetchJSON(file).then(function (snapshots) {
      state.snapshots = snapshots || [];
      state.index = 0;
      el.loading.classList.add("hidden");
      if (state.snapshots.length === 0) {
        el.noData.textContent = "No snapshots recorded yet for week " + week + ". Check back once games start.";
        el.noData.classList.remove("hidden");
        el.content.classList.add("hidden");
        return;
      }
      el.noData.classList.add("hidden");
      el.content.classList.remove("hidden");
      render();
    }).catch(function (err) {
      el.loading.classList.add("hidden");
      el.noData.textContent = "Couldn't load data for week " + week + ": " + err.message;
      el.noData.classList.remove("hidden");
    });
  }

  function init() {
    fetchJSON("data/current.json").then(function (current) {
      state.current = current;
      var weeks = Object.keys(current.weeks || {}).map(Number).sort(function (a, b) { return a - b; });
      if (weeks.length === 0) {
        el.loading.classList.add("hidden");
        el.noData.textContent = "No snapshots yet. The collector runs automatically during game windows — check back after kickoff.";
        el.noData.classList.remove("hidden");
        return;
      }
      if (weeks.length > 1) {
        el.weekSelectWrap.classList.remove("hidden");
        weeks.forEach(function (w) {
          var opt = document.createElement("option");
          opt.value = w;
          opt.textContent = "Week " + w;
          el.weekSelect.appendChild(opt);
        });
        el.weekSelect.value = current.latest_week;
        el.weekSelect.addEventListener("change", function () {
          loadWeek(parseInt(el.weekSelect.value, 10));
        });
      }
      loadWeek(current.latest_week);
    }).catch(function (err) {
      el.loading.classList.add("hidden");
      el.noData.textContent = "Couldn't load data/current.json: " + err.message;
      el.noData.classList.remove("hidden");
    });
  }

  init();
})();
</script>
</body>
</html>
