name: Collect live matchup snapshot

on:
  schedule:
    # Every 10 minutes, Thu/Sat/Sun/Mon, 15:00-23:59 and 00:00-05:59 UTC
    # (roughly 11am ET Thursday through Monday-night-football overtime).
    # Cron day-of-week: 0=Sun, 1=Mon, 4=Thu, 6=Sat.
    - cron: "*/10 15-23 * * 0,1,4,6"
    - cron: "*/10 0-5 * * 0,1,2,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        run: python scripts/collector.py

      - name: Commit and push data
        run: |
          git config user.name "sunday-forever-replay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
