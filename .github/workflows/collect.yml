name: Collect live matchup snapshot

on:
  schedule:
    # Every 10 minutes, every day of the week, 10:00-23:59 and 00:00-05:59 UTC
    # (roughly 6am ET through 1am ET the next day). NFL games no longer stick
    # to a fixed Thu/Sat/Sun/Mon pattern -- there are Wednesday openers,
    # Friday international games, Saturday slates, Christmas games, etc. -- so
    # this covers every realistic kickoff window regardless of which day it
    # falls on, rather than guessing specific days. The only gap is 06:00-
    # 09:59 UTC (roughly 2am-6am ET), when NFL games are never played. This
    # repo is public, so GitHub Actions minutes are free/unlimited.
    - cron: "*/10 10-23 * * *"
    - cron: "*/10 0-5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector
        run: python scripts/collector.py

      - name: Commit and push data
        run: |
          git config user.name "sunday-forever-replay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
