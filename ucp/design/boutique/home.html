<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>UCP — الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boutique.css">
<style>
/* ===========================================================================
   WARM BOUTIQUE — HOMEPAGE
   Implemented from the handoff's "1. Homepage — Desktop" and "2. Homepage —
   Mobile" specs. Layout, sizes and radii are the handoff's; the products,
   photographs and category counts are UCP's real catalogue.
   =========================================================================== */

/* --- prototype bar (review aid; the handoff says this is not production) --- */
.proto {
  background:var(--ink); color:#D8CDC4; font-size:11px; padding:8px 16px;
  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; text-align:center;
}
.proto b { color:var(--orange); }
.proto button {
  border:1px solid rgba(255,255,255,.28); border-radius:var(--pill);
  padding:4px 12px; font-size:11px; font-weight:600; color:#fff;
}
.proto button[aria-pressed="true"] { background:var(--orange); color:var(--on-orange); border-color:transparent; }

/* --- header: centred logo, centred pill search, utility row --------------- */
.hd { padding-block:26px 20px; border-bottom:1px solid var(--line); }
.hd-in { display:flex; flex-direction:column; align-items:center; gap:16px; }
.hd .logo img { height:64px; width:auto; }
.searchbar {
  width:min(520px,100%); height:46px; border-radius:var(--pill); background:var(--white);
  border:1px solid var(--line-strong);   /* a control's edge needs 3:1, not a decorative hairline */
  box-shadow:var(--sh-search); display:flex; align-items:center; gap:10px; padding-inline:20px;
}
.searchbar input { flex:1; min-width:0; border:0; background:none; font-size:13px; outline:none; }
.searchbar input::placeholder { color:var(--muted-tx); }
.utility { display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap; font-size:13px; }
.utility a:hover { text-decoration:underline; text-underline-offset:3px; }
.utility .rx { color:var(--accent-tx); font-weight:600; display:inline-flex; align-items:center; gap:7px; }
.utility .rx::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--orange); }

/* --- hero ----------------------------------------------------------------- */
.hero { padding-block:46px 0; text-align:center; }
.hero .eyebrow {
  display:inline-block; background:var(--tint); color:var(--accent-tx);
  padding:6px 16px; border-radius:var(--pill); font-size:11px; font-weight:600;
}
.hero h1 { font-size:30px; font-weight:600; margin-top:18px; }
@media (min-width:760px) { .hero h1 { font-size:42px; } }
.hero .sub { font-size:15px; color:var(--muted-tx); margin-top:12px; }
.hero .cta { margin-top:26px; }
.hero-strip { display:flex; justify-content:center; gap:18px; margin-top:40px; }
.hero-strip .hs {
  width:min(220px,28vw); aspect-ratio:1/.92; border-radius:var(--r-feature);
  background:var(--tan); display:grid; place-items:center; padding:18px;
  /* NOT a percentage: percentage padding resolves against the containing
     block's inline size — the flex row, ~1160px — which put 81px of padding
     inside a 220px tile and shrank the packshot to 58px. */
}
.hero-strip .hs:nth-child(2) { background:var(--tint); transform:translateY(-14px); }
.hero-strip .hs:nth-child(3) { transform:translateY(8px); }
.hero-strip img { width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; }
.hero-strip svg { width:100%; height:100%; }
@media (max-width:759px) { .hero-strip { display:none; } }

/* --- prescription banner (dark feature card) ------------------------------ */
.rxband {
  background:var(--ink); color:var(--white); border-radius:var(--r-feature);
  padding:34px; display:flex; gap:22px; align-items:center; justify-content:space-between; flex-wrap:wrap;
}
.rxband h2 { font-size:22px; font-weight:600; }
.rxband p { font-size:13px; color:#C9BDB3; margin-top:7px; max-width:46ch; }

/* --- delivery / pickup pills ---------------------------------------------- */
.duo2 { display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:700px) { .duo2 { grid-template-columns:1fr 1fr; } }
.duo2 .p {
  background:var(--white); border-radius:var(--pill); box-shadow:var(--sh-card);
  padding:18px 24px; display:flex; align-items:center; gap:16px;
}
.duo2 .p .ic { width:44px; height:44px; border-radius:50%; background:var(--tint); display:grid; place-items:center; color:var(--accent-tx); flex:none; }
.duo2 .p b { display:block; font-size:14px; font-weight:600; }
.duo2 .p span { font-size:12px; color:var(--muted-tx); }

/* --- footer ---------------------------------------------------------------- */
.ft { background:var(--tan); padding-block:44px 30px; margin-top:20px; }
.ft-cols { display:grid; gap:28px; grid-template-columns:repeat(2,1fr); }
@media (min-width:860px) { .ft-cols { grid-template-columns:repeat(4,1fr); } }
.ft h4 { font-size:13px; font-weight:700; margin-bottom:12px; }
.ft li a { display:block; padding-block:5px; font-size:13px; color:var(--muted-tx); }
.ft li a:hover { color:var(--ink); }
.ft .mark { display:flex; align-items:flex-end; justify-content:flex-start; }
.ft .mark img { height:54px; width:auto; }
.ft .bot { border-top:1px solid var(--line); margin-top:28px; padding-top:18px; font-size:11px; color:var(--muted-tx); display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:space-between; }

/* --- mobile bottom nav (handoff: 5 items, Home centred and emphasised) ----- */
.bnav {
  position:fixed; inset-inline:0; inset-block-end:0; z-index:80;
  background:var(--white); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
@media (min-width:900px) { .bnav { display:none; } }
.bnav a { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--muted-tx); padding:6px 12px; border-radius:var(--pill); }
.bnav a[aria-current="page"] { background:var(--orange); color:var(--on-orange); font-weight:600; }
body { padding-bottom:72px; }
@media (min-width:900px) { body { padding-bottom:0; } }
</style>
</head>
<body>
<div class="proto">
  <span><b>UCP — Warm Boutique</b> · <span id="protoTx"></span></span>
  <button id="langBtn" data-lang>EN</button>
</div>

<header class="hd"><div class="wrap hd-in">
  <a href="home.html" class="logo"><img src="ucp-logo-mark.png" alt="UCP"></a>
  <div class="searchbar"><span id="si"></span><input id="q" type="search" autocomplete="off"></div>
  <nav class="utility" id="utility"></nav>
</div></header>

<main id="main">
  <section class="hero"><div class="wrap">
    <span class="eyebrow" id="hEy"></span>
    <h1 id="hH"></h1>
    <p class="sub" id="hP"></p>
    <a class="pill pill--cta cta" id="hCta" href="category.html"></a>
    <div class="hero-strip" id="hStrip"></div>
  </div></section>

  <section class="section"><div class="wrap">
    <h2 class="section-title" id="tCats"></h2>
    <div class="circles" id="cats" style="margin-top:28px"></div>
    <a class="viewall" id="allCats" href="category.html"></a>
  </div></section>

  <section class="section section--tan"><div class="wrap">
    <h2 class="section-title" id="tBrands"></h2>
    <div class="brandrow" id="brands" style="margin-top:26px"></div>
  </div></section>

  <div id="merch"></div>

  <section class="section"><div class="wrap">
    <div class="rxband">
      <div><h2 id="rxH"></h2><p id="rxP"></p></div>
      <a class="pill pill--cta" id="rxCta" href="prescription.html"></a>
    </div>
  </div></section>

  <section class="section" style="padding-top:0"><div class="wrap">
    <div class="duo2" id="duo"></div>
  </div></section>
</main>

<footer class="ft"><div class="wrap">
  <div class="ft-cols" id="ftCols"></div>
  <div class="bot"><span id="ftR"></span><span id="ftN"></span></div>
</div></footer>

<nav class="bnav" id="bnav" aria-label="primary"></nav>

<script src="../ninja/catalogue.js"></script>
<script src="../ninja/ucp.js"></script>
<script src="boutique.js"></script>
<script>
const TX = {
  ar: { eyebrow:"UCP ONLINE",
        heroH:"كل ما تحتاجه، في مكانه الصحيح.",
        heroP:"صيدلية وتجميل. توصيل سريع أو استلام من الفرع، اختر ما يناسبك.",
        shopNow:"تسوّق الآن", cats:"الفئات", brands:"تسوق عبر العلامة التجارية",
        rxH:"اطلب وصفتك الطبية", rxP:"ارفع صورة الوصفة ويراجعها صيدلي مرخّص، ثم نجهّزها للتوصيل أو الاستلام.",
        rxCta:"ارفع وصفتك",
        delivery:"توصيل سريع", deliveryP:"خلال ٦٠ دقيقة داخل الرياض",
        pickup:"استلام من الفرع", pickupP:"نجهّز طلبك وتستلمه من أقرب فرع",
        home:"الرئيسية", search:"البحث", loyalty:"الولاء", cart:"السلة", account:"حسابي",
        proto:"الأسماء والصور من كتالوج UCP الفعلي · الأسعار تجريبية",
        merch:["الأكثر طلبًا","مختارات لك","عروض مميزة"],
        ftShop:"التسوق", ftCare:"خدمات صيدلية", ftAbout:"عن UCP", ftLegal:"السياسات",
        rights:"جميع الحقوق محفوظة", vat:"شامل الضريبة" },
  en: { eyebrow:"UCP ONLINE",
        heroH:"Everything you need, exactly where it should be.",
        heroP:"Pharmacy and beauty. Fast delivery or branch pickup — your choice.",
        shopNow:"Shop now", cats:"Categories", brands:"Shop by brand",
        rxH:"Order your prescription", rxP:"Upload a photo, a licensed pharmacist reviews it, then we prepare it for delivery or pickup.",
        rxCta:"Upload prescription",
        delivery:"Fast delivery", deliveryP:"Within 60 minutes inside Riyadh",
        pickup:"Branch pickup", pickupP:"We prepare it, you collect it",
        home:"Home", search:"Search", loyalty:"Loyalty", cart:"Cart", account:"Account",
        proto:"Names and photographs are UCP's real catalogue · prices are placeholder",
        merch:["Most Wanted","Picks For You","Featured Offers"],
        ftShop:"Shop", ftCare:"Pharmacy services", ftAbout:"About UCP", ftLegal:"Policies",
        rights:"All rights reserved", vat:"VAT included" },
};
const tx = () => TX[Shell.lang];

function render() {
  const T = tx(), TT = Shell.T(), n = Shell.nm, ar = Shell.lang === "ar";
  set("protoTx", T.proto);
  document.getElementById("langBtn").textContent = ar ? "EN" : "ع";
  set("si", ic("search", 17));
  $("#q").placeholder = TT.searchPh;

  set("utility", [[T.account,"#"],[T.loyalty,"loyalty.html"],[TT.cart + " (" + Shell.count() + ")","cart.html"]]
      .map(([lb,h]) => '<a href="' + h + '">' + lb + '</a>').join('')
    + '<a class="rx" href="prescription.html">' + TT.rx + '</a>');

  set("hEy", T.eyebrow); set("hH", T.heroH); set("hP", T.heroP);
  $("#hCta").innerHTML = T.shopNow + ' <span aria-hidden="true">' + (ar ? "←" : "→") + '</span>';

  const top = Shell.list("top");
  set("hStrip", top.slice(0, 3).map((p) =>
    '<a class="hs" href="' + pdp(p) + '">' + shot(p) + '</a>').join(''));

  set("tCats", T.cats);
  set("cats", UCP.categories.map((c) =>
    '<a class="circle-item" href="category.html?cat=' + c.id + '">'
    + '<span class="c">' + ic(c.icon, 34) + '</span>'
    + '<span class="t">' + n(c) + '</span></a>').join(''));
  set("allCats", TT.viewAll);

  set("tBrands", T.brands);
  /* The handoff uses single placeholder letters here because it had no brand
     list. We have 1,106 real brands, and a letter monogram of a real brand is
     worse than its name — "'L" for L'Oréal reads as a typo. Production should
     use brand logos; until then, the name itself. */
  set("brands", UCP.brands.slice(0, 10).map((b) => {
    const label = b.en.split(/[\s-]/)[0];   /* first word; CSS wraps it */
    return '<a href="category.html?brand=' + b.id + '" title="' + esc2(b.en) + '">'
      + esc2(label) + '</a>';
  }).join(''));

  const rows = [Shell.list("top"), Shell.list("picked"), Shell.list("offers")];
  set("merch", T.merch.map((title, i) => {
    const items = rows[i].slice(0, 12);
    const alt = i === 1 ? " section--tan" : "";
    return '<section class="section' + alt + '"><div class="wrap">'
      + '<h2 class="section-title" style="text-align:start">' + title + '</h2>'
      + '<div class="hrow" style="margin-top:20px">' + items.map(pcard).join('') + '</div>'
      + '</div></section>';
  }).join(''));

  set("rxH", T.rxH); set("rxP", T.rxP);
  $("#rxCta").textContent = T.rxCta;

  set("duo", [["truck", T.delivery, T.deliveryP], ["store", T.pickup, T.pickupP]]
    .map((r) => '<div class="p"><span class="ic">' + ic(r[0], 22) + '</span>'
      + '<span><b>' + r[1] + '</b><span>' + r[2] + '</span></span></div>').join(''));

  const cols = [
    [T.ftShop, UCP.categories.slice(0, 5).map(n)],
    [T.ftCare, [TT.rx, TT.tele, TT.pickup, TT.vitamins, TT.loyalty]],
    [T.ftAbout, [TT.brand, ar ? "فروعنا" : "Our branches", ar ? "وظائف" : "Careers"]],
  ];
  set("ftCols", cols.map((c) => '<div><h4>' + c[0] + '</h4><ul>'
      + c[1].map((x) => '<li><a href="#">' + x + '</a></li>').join('') + '</ul></div>').join('')
    + '<div class="mark"><img src="ucp-logo-mark.png" alt="UCP"></div>');
  set("ftR", "© " + new Date().getFullYear() + " " + TT.brand + " — " + T.rights);
  set("ftN", T.vat);

  set("bnav", [["search", T.search, "category.html", 0], ["store", T.home, "home.html", 1],
               ["gift", T.loyalty, "loyalty.html", 0], ["cart", TT.cart, "cart.html", 0],
               ["user", T.account, "#", 0]]
    .map(([i, lb, h, cur]) => '<a href="' + h + '"' + (cur ? ' aria-current="page"' : '') + '>'
      + ic(i, 20) + '<span>' + lb + '</span></a>').join(''));
}

Shell.onRender(render);
Shell.wire();
Shell.setLang("ar");
</script>
</body>
</html>
