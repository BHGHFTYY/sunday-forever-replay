<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>UCP — THEME 02 PREMIUM</title>
<meta name="description" content="UCP homepage design prototype — Premium direction. Placeholder content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   THEME 02 — PREMIUM
   ---------------------------------------------------------------------------
   Concept: APOTHECARY. Quiet, editorial, expensive.

   The opposite bet from Ninja. Where Ninja shouts in orange, this theme
   almost withholds it: orange appears as a hairline rule, a small-caps
   label, and one deep burnt fill (#B83D06, 5.66:1 with white). Restraint is
   the luxury signal — a page that uses its brand colour sparingly reads as
   confident, one that floods it reads as a sale.

   Structure: warm paper ground, serif display (Amiri / Cormorant), enormous
   whitespace, thin rules instead of boxes, products floating on paper with
   NO card borders, asymmetric editorial mosaic for categories, search
   hidden behind an icon that opens a full-screen overlay.
   =========================================================================== */

:root {
  --paper:   #FAF7F2;
  --paper-2: #FFFFFF;
  --stone:   #EFE9E0;
  --stone-2: #E4DBCE;
  --rule:    #DCD2C4;
  --rule-2:  #C8BBA9;

  --espresso: #1C1815;
  --muted:    #6B6259;
  --faint:    #9A8F83;

  --burnt:      #B83D06;   /* the only orange that carries white text */
  --burnt-deep: #A63504;
  --ember:      #E8A87C;   /* warm accent, dark surfaces only */

  --dark:   #241E19;
  --on-dark:#FAF7F2;
  --on-dark-mut:#A79A8C;

  --serif-ar: "Amiri", "Times New Roman", serif;
  --serif-en: "Cormorant Garamond", "Times New Roman", serif;
  --ui: "Readex Pro", system-ui, sans-serif;

  --slow: 420ms cubic-bezier(.22,1,.36,1);
  --mid:  260ms cubic-bezier(.22,1,.36,1);
  --wrap: 1240px;
}

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body {
  margin: 0; overflow-x: hidden; max-width: 100%;
  background: var(--paper); color: var(--espresso);
  font-family: var(--ui); font-size: 15.5px; line-height: 1.75; font-weight: 300;
  -webkit-font-smoothing: antialiased;
}
:lang(ar) body, :lang(ar) { line-height: 1.95; }
h1,h2,h3 { margin: 0; font-weight: 400; letter-spacing: -.01em; }

/* Arabic letterforms join. ANY letter-spacing severs them — the heading
   above rendered as "تسوّ ق حس ب" before this rule. Latin tracking is a
   typographic nicety; Arabic tracking is a spelling error, so it is
   overridden unconditionally rather than per-selector. */
:lang(ar), :lang(ar) * { letter-spacing: normal !important; }
html[lang=ar] h1, html[lang=ar] h2, html[lang=ar] h3, html[lang=ar] .disp { font-family: var(--serif-ar); line-height: 1.5; }
html[lang=en] h1, html[lang=en] h2, html[lang=en] h3, html[lang=en] .disp { font-family: var(--serif-en); line-height: 1.12; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
img,svg { display: block; max-width: 100%; }
input { font: inherit; }
:focus-visible { outline: 1.5px solid var(--burnt); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { width: 100%; max-width: var(--wrap); margin-inline: auto; padding-inline: 22px; }
@media (min-width: 900px) { .wrap { padding-inline: 44px; } }
.sr { position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap }
.skip{position:absolute;inset-block-start:-999px;inset-inline-start:16px;z-index:999;background:var(--burnt);color:#fff;padding:12px 20px}
.skip:focus{inset-block-start:12px}

/* small-caps label — the theme's connective tissue */
.lbl { font-family: var(--ui); font-size: 10.5px; font-weight: 500; letter-spacing: .22em;
       text-transform: uppercase; color: var(--burnt); }
html[lang=ar] .lbl { letter-spacing: .06em; font-size: 11.5px; }

.proto{background:var(--stone);color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-align:center;padding:7px 12px;
  text-transform:uppercase;font-weight:500}
html[lang=ar] .proto{letter-spacing:.04em}
.proto b{color:var(--burnt);font-weight:600}

/* ---- header: minimal, hairline ------------------------------------------ */
.hd{position:sticky;top:0;z-index:100;background:rgba(250,247,242,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule)}
.hd .wrap{display:flex;align-items:center;gap:22px;height:74px}
@media(min-width:900px){.hd .wrap{height:92px;gap:36px}}
.logo{display:flex;align-items:center;gap:11px;flex:none}
.logo-mk{width:40px;height:40px;border:1px solid var(--rule-2);display:grid;place-items:center;border-radius:50%}
.logo-mk b{font-family:var(--serif-en);font-size:19px;font-weight:500;letter-spacing:.02em}
.logo-tx b{display:block;font-family:var(--serif-en);font-size:23px;font-weight:500;letter-spacing:.14em;line-height:1}
.logo-tx i{display:none;font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-top:4px}
@media(min-width:700px){.logo-tx i{display:block}}

.nav-c{display:none;gap:30px;margin-inline:auto}
@media(min-width:1000px){.nav-c{display:flex}}
.nav-c a{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;color:var(--muted);
  padding-bottom:3px;border-bottom:1px solid transparent;transition:color var(--mid),border-color var(--mid)}
html[lang=ar] .nav-c a{font-size:13.5px;letter-spacing:.02em;text-transform:none}
.nav-c a:hover{color:var(--espresso);border-color:var(--burnt)}

.hd-act{display:flex;align-items:center;gap:4px;margin-inline-start:auto;flex:none}
@media(min-width:1000px){.hd-act{margin-inline-start:0}}
.ib{width:44px;height:44px;display:grid;place-items:center;position:relative;color:var(--espresso);
  border-radius:50%;transition:background var(--mid)}
.ib:hover{background:var(--stone)}
.badge{position:absolute;top:5px;inset-inline-end:5px;min-width:17px;height:17px;background:var(--burnt);color:#fff;
  font-size:10px;font-weight:500;display:grid;place-items:center;border-radius:9px;padding-inline:4px}

/* full-screen search overlay — search is not part of the furniture here */
.ovl{position:fixed;inset:0;width:100%;max-width:100vw;overflow:hidden;background:var(--paper);z-index:300;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--mid)}
.ovl.on{opacity:1;pointer-events:auto}
.ovl-h{display:flex;justify-content:flex-end;padding:26px 22px}
.ovl-b{flex:1;overflow:auto;padding:0 22px 40px}
.ovl-in{max-width:760px;margin-inline:auto}
.ovl input{width:100%;border:0;border-bottom:1px solid var(--rule-2);background:none;outline:0;
  font-family:var(--serif-en);font-size:clamp(26px,5vw,46px);font-weight:400;padding:14px 0;color:var(--espresso)}
html[lang=ar] .ovl input{font-family:var(--serif-ar)}
.ovl input::placeholder{color:var(--faint)}
.ovl-res{margin-top:34px;display:grid;gap:2px}
.ores{display:flex;align-items:center;gap:18px;padding:13px 6px;border-bottom:1px solid var(--rule);transition:background var(--mid)}
.ores:hover{background:var(--stone)}
.ores svg{width:54px;height:54px;flex:none;border-radius:2px}
.ores .t{flex:1;min-width:0}
.ores .t b{display:block;font-weight:400;font-size:16px}
.ores .t span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
html[lang=ar] .ores .t span{letter-spacing:.02em;text-transform:none;font-size:12.5px}
.ores .p{font-weight:500;flex:none}
.ovl-grp{margin-top:30px}

/* ---- hero: centred editorial -------------------------------------------- */
.hero{text-align:center;padding-block:56px 20px;position:relative}
@media(min-width:900px){.hero{padding-block:92px 34px}}
.hero .lbl{display:block;margin-bottom:22px}
.hero h1{font-size:clamp(38px,7.2vw,84px);font-weight:400;max-width:15ch;margin-inline:auto}
html[lang=ar] .hero h1{font-size:clamp(32px,6.2vw,68px);max-width:18ch}
.hero h1 em{font-style:italic;color:var(--burnt)}
html[lang=ar] .hero h1 em{font-style:normal;color:var(--burnt)}
.hero p{margin:24px auto 0;max-width:52ch;color:var(--muted);font-size:16px}
.hero-rule{width:1px;height:54px;background:var(--rule-2);margin:34px auto 0}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding-inline:34px;
  font-family:var(--ui);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  border-radius:0;transition:all var(--mid)}
html[lang=ar] .btn{font-size:14px;letter-spacing:.02em;text-transform:none}
.btn-f{background:var(--burnt);color:#fff}
.btn-f:hover{background:var(--burnt-deep)}
.btn-o{border:1px solid var(--rule-2);color:var(--espresso)}
.btn-o:hover{border-color:var(--espresso);background:var(--stone)}

/* ---- service line: three columns divided by hairlines ------------------- */
.svc{border-block:1px solid var(--rule);margin-top:46px}
.svc .wrap{display:grid}
@media(min-width:800px){.svc .wrap{grid-template-columns:repeat(3,1fr)}}
.svc a{display:flex;gap:16px;align-items:flex-start;padding:26px 8px;border-bottom:1px solid var(--rule);
  transition:background var(--mid)}
@media(min-width:800px){.svc a{border-bottom:0;border-inline-start:1px solid var(--rule);padding-inline:26px}
  .svc a:first-child{border-inline-start:0;padding-inline-start:0}}
.svc a:last-child{border-bottom:0}
.svc a:hover{background:var(--stone)}
.svc svg{color:var(--burnt);flex:none;margin-top:3px}
.svc b{display:block;font-weight:500;font-size:15px;margin-bottom:3px}
.svc span{font-size:13px;color:var(--muted);line-height:1.6}

/* ---- section heading: centred, hairline ---------------------------------- */
.sec{padding-block:64px}
@media(min-width:900px){.sec{padding-block:92px}}
.sec-hd{text-align:center;margin-bottom:44px}
.sec-hd .lbl{display:block;margin-bottom:12px}
.sec-hd h2{font-size:clamp(27px,4.2vw,46px)}
.sec-hd .r{width:38px;height:1px;background:var(--burnt);margin:20px auto 0}
.sec-more{display:flex;justify-content:center;margin-top:44px}

/* ---- categories: asymmetric editorial mosaic ---------------------------- */
.mos{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.mos{grid-template-columns:repeat(4,1fr);grid-auto-rows:190px}}
.mt{position:relative;overflow:hidden;background:var(--stone);display:flex;align-items:flex-end;padding:22px;
  min-height:160px;transition:all var(--mid);border:1px solid transparent}
.mt:hover{border-color:var(--rule-2)}
.mt-art svg{mix-blend-mode:multiply}
.mt-art{--strip-bg:1}
.mt-art{position:absolute;inset-block-end:-6%;inset-inline-end:-4%;width:52%;opacity:.5;
  transition:transform var(--slow),opacity var(--mid);pointer-events:none}
.mt:hover .mt-art{transform:translateY(-4px);opacity:.72}
.mt.big .mt-art{width:44%}
@media(min-width:800px){
  .mt{min-height:0}
  .mt.big{grid-column:span 2;grid-row:span 2}
  .mt.wide{grid-column:span 2}
}
.mt::before{content:"";position:absolute;inset:0;transition:transform var(--slow)}
.mt:hover::before{transform:scale(1.05)}
.mt-in{position:relative}
.mt b{display:block;font-size:17px;font-weight:400}
html[lang=en] .mt b{font-family:var(--serif-en);font-size:22px;font-weight:500}
.mt.big b{font-size:24px}
html[lang=en] .mt.big b{font-size:34px}
.mt span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
html[lang=ar] .mt span{letter-spacing:.02em;text-transform:none;font-size:12.5px}
.mt-ico{position:absolute;inset-block-start:18px;inset-inline-end:18px;color:var(--burnt);opacity:.55}

/* ---- products: no cards, just product on paper -------------------------- */
.pgrid{display:grid;gap:34px 20px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.pgrid{grid-template-columns:repeat(3,1fr);gap:56px 34px}}
@media(min-width:1100px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.prail{display:grid;grid-auto-flow:column;gap:22px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.prail::-webkit-scrollbar{display:none}
.prail>*{width:240px}
@media(min-width:900px){.prail>*{width:280px}}

.p{position:relative;display:flex;flex-direction:column;text-align:center}
.p-img{position:relative;aspect-ratio:4/5;background:var(--paper-2);overflow:hidden;margin-bottom:18px}
.p-img svg{width:100%;height:100%;transition:transform var(--slow)}
.p:hover .p-img svg{transform:scale(1.045)}
.p-off{position:absolute;inset-block-start:14px;inset-inline-start:14px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--burnt);background:rgba(250,247,242,.92);padding:4px 9px}
html[lang=ar] .p-off{letter-spacing:.02em;text-transform:none;font-size:11.5px}
.p-flag{position:absolute;inset-block-end:0;inset-inline:0;background:rgba(36,30,25,.86);color:var(--on-dark);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px}
html[lang=ar] .p-flag{letter-spacing:.02em;text-transform:none;font-size:12px}
.p-br{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
html[lang=ar] .p-br{letter-spacing:.03em;text-transform:none;font-size:12px}
.p-n{font-size:16px;font-weight:400;line-height:1.45;min-height:2.9em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[lang=en] .p-n{font-family:var(--serif-en);font-size:19px;font-weight:500;line-height:1.25}
.p-pr{margin-top:10px;display:flex;align-items:baseline;justify-content:center;gap:11px}
.p-pr b{font-weight:500;font-size:17px;display:inline-flex;gap:4px;align-items:baseline}
.p-pr .cur{font-size:11px;color:var(--muted);letter-spacing:.08em}
.was{display:inline-flex;gap:3px;align-items:baseline;color:var(--faint);font-size:13px;text-decoration:line-through}
.was .cur{font-size:10px}
.p-add{margin-top:14px;height:44px;border:1px solid var(--rule-2);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;transition:all var(--mid)}
html[lang=ar] .p-add{letter-spacing:.02em;text-transform:none;font-size:13.5px}
.p-add:hover{background:var(--espresso);border-color:var(--espresso);color:var(--paper)}
.p-add.ok{background:var(--burnt);border-color:var(--burnt);color:#fff}
.p-add:disabled{opacity:.4;cursor:not-allowed}

/* ---- quiet brand grid ---------------------------------------------------- */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--rule);border-inline-start:1px solid var(--rule)}
@media(min-width:600px){.bgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.bgrid{grid-template-columns:repeat(8,1fr)}}
.bg-i{border-bottom:1px solid var(--rule);border-inline-end:1px solid var(--rule);padding:26px 14px;
  display:grid;place-items:center;gap:8px;transition:background var(--mid)}
.bg-i:hover{background:var(--paper-2)}
.bg-i svg{width:100%;height:30px;opacity:.72;transition:opacity var(--mid)}
.bg-i:hover svg{opacity:1}
.bg-i span{font-size:10.5px;color:var(--faint)}

/* ---- packages: letterpress panels ---------------------------------------- */
.pks{display:grid;gap:18px}
@media(min-width:850px){.pks{grid-template-columns:repeat(3,1fr)}}
.pk{background:var(--paper-2);border:1px solid var(--rule);padding:30px 26px;display:flex;flex-direction:column;
  gap:12px;transition:all var(--mid);text-align:center}
.pk:hover{border-color:var(--rule-2);transform:translateY(-3px)}
.pk h3{font-size:22px}
html[lang=en] .pk h3{font-size:26px}
.pk .note{font-size:12.5px;color:var(--muted)}
.pk-r{width:28px;height:1px;background:var(--burnt);margin:4px auto}
.pk-pr{margin-top:auto;padding-top:14px}
.pk-pr b{display:block;font-size:30px;font-weight:500}
html[lang=en] .pk-pr b{font-family:var(--serif-en)}
.pk-pr .cur{font-size:13px;color:var(--muted)}
.pk-save{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--burnt);margin-top:6px}
html[lang=ar] .pk-save{letter-spacing:.02em;text-transform:none;font-size:12.5px}

/* ---- prescription: double-ruled panel ------------------------------------ */
.rx{background:var(--paper-2);border-block:1px solid var(--rule)}
.rx .wrap{display:grid;gap:36px;padding-block:66px}
@media(min-width:900px){.rx .wrap{grid-template-columns:1fr 1fr;gap:72px;align-items:center}}
.rx h2{font-size:clamp(28px,4.4vw,44px)}
.rx p{color:var(--muted);margin-top:16px;max-width:44ch}
.rx-steps{display:grid;gap:0;border-top:1px solid var(--rule)}
.rx-st{display:flex;gap:22px;align-items:flex-start;padding:22px 0;border-bottom:1px solid var(--rule)}
.rx-st .n{font-family:var(--serif-en);font-size:26px;color:var(--burnt);line-height:1;flex:none;width:34px}
.rx-st b{display:block;font-weight:500;font-size:16px;margin-bottom:4px}
.rx-st span{font-size:13.5px;color:var(--muted);line-height:1.7}

/* ---- loyalty: espresso band ---------------------------------------------- */
.loy{background:var(--dark);color:var(--on-dark)}
.loy .wrap{display:grid;gap:34px;padding-block:66px}
@media(min-width:900px){.loy .wrap{grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}}
.loy .lbl{color:var(--ember)}
.loy h2{font-size:clamp(28px,4.4vw,46px);margin-top:14px}
.loy p{color:var(--on-dark-mut);margin-top:16px;max-width:42ch}
.loy-card{border:1px solid #3B322A;padding:34px}
.loy-card .lbl{color:var(--ember);display:block;margin-bottom:14px}
.loy-pts{font-family:var(--serif-en);font-size:64px;line-height:1;font-weight:400}
.loy-tier{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-dark-mut);margin-top:10px}
html[lang=ar] .loy-tier{letter-spacing:.02em;text-transform:none;font-size:14px}
.loy-bar{height:1px;background:#3B322A;margin-top:26px;position:relative}
.loy-bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ember);height:1px}
.loy-bar::after{content:"";position:absolute;inset-block-start:-2px;inset-inline-start:var(--at,0);width:5px;height:5px;
  background:var(--ember);border-radius:50%}
.loy-next{font-size:12.5px;color:var(--on-dark-mut);margin-top:14px}
.btn-e{background:var(--ember);color:var(--dark)}
.btn-e:hover{background:#F0BC96}

/* ---- footer -------------------------------------------------------------- */
.ft{border-top:1px solid var(--rule);margin-top:0}
.ft-cols{display:grid;gap:34px;padding-block:58px}
@media(min-width:700px){.ft-cols{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1050px){.ft-cols{grid-template-columns:1.5fr repeat(4,1fr)}}
.ft h3{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--espresso);margin-bottom:16px;font-weight:500;font-family:var(--ui)}
html[lang=ar] .ft h3{letter-spacing:.03em;text-transform:none;font-size:13px}
.ft ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ft a{font-size:13.5px;color:var(--muted);transition:color var(--mid)}
.ft a:hover{color:var(--espresso)}
.ft-bot{border-top:1px solid var(--rule)}
.ft-bot .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
  padding-block:22px;font-size:11.5px;color:var(--faint)}
.pay{display:flex;gap:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}

/* ---- drawer / menu ------------------------------------------------------- */
/* `inset: 0` alone left the scrim 11px wider than the viewport, which was
   enough to make the whole page scroll sideways on a phone. Sizing it
   explicitly removes the last horizontal overflow. */
.scrim{position:fixed;inset:0;width:100%;height:100%;background:rgba(28,24,21,.42);z-index:290;opacity:0;pointer-events:none;transition:opacity var(--mid)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(400px,92vw);background:var(--paper);z-index:300;
  display:flex;flex-direction:column;transform:translateX(var(--out));transition:transform var(--slow)}
html[dir=rtl] .drawer{--out:-100%} html[dir=ltr] .drawer{--out:100%}
.drawer.on{transform:translateX(0)}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:22px;border-bottom:1px solid var(--rule)}
.dr-h b{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
html[lang=ar] .dr-h b{letter-spacing:.03em;text-transform:none;font-size:15px}
.dr-body{flex:1;overflow:auto;padding:16px 22px;display:grid;gap:0;align-content:start}
.dr-empty{text-align:center;color:var(--faint);padding:64px 0}
.dr-i{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule)}
.dr-i svg{width:62px;height:62px;flex:none}
.dr-i .t{flex:1;min-width:0}
.dr-i .t b{display:block;font-weight:400;font-size:14.5px;line-height:1.4}
.dr-i .t .pr{font-weight:500;font-size:14px;display:inline-flex;gap:3px;align-items:baseline;margin-top:4px}
.dr-qty{display:flex;align-items:center;border:1px solid var(--rule);height:32px;margin-top:8px;width:fit-content}
.dr-qty button{width:32px;height:30px}
.dr-qty span{width:32px;text-align:center;font-size:13px}
.dr-f{border-top:1px solid var(--rule);padding:22px;display:grid;gap:14px}
.dr-tot{display:flex;justify-content:space-between;align-items:baseline}
.dr-tot b{font-family:var(--serif-en);font-size:30px;font-weight:500;display:inline-flex;gap:5px;align-items:baseline}
.dr-tot .cur{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dr-note{font-size:11px;color:var(--faint);line-height:1.6}
.mm{position:fixed;inset-block:0;inset-inline-start:0;width:min(330px,88vw);background:var(--paper);z-index:300;
  transform:translateX(var(--mo));transition:transform var(--slow);overflow:auto}
html[dir=rtl] .mm{--mo:100%} html[dir=ltr] .mm{--mo:-100%}
.mm.on{transform:translateX(0)}
.mm a{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--rule);font-size:14.5px}
.mm a svg{color:var(--burnt)}
.mm-t{padding:24px 22px 8px}
.toast{position:fixed;inset-block-end:26px;inset-inline-start:50%;transform:translate(50%,140%);background:var(--dark);
  color:var(--on-dark);padding:15px 26px;font-size:13px;letter-spacing:.06em;z-index:400;transition:transform var(--slow)}
html[dir=ltr] .toast{transform:translate(-50%,140%)}
.toast.on{transform:translate(50%,0)} html[dir=ltr] .toast.on{transform:translate(-50%,0)}
.desk-only{display:none} @media(min-width:1000px){.desk-only{display:flex}}
.mob-only{display:grid} @media(min-width:1000px){.mob-only{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<div class="proto" id="proto"></div>

<header class="hd">
  <div class="wrap">
    <button class="ib mob-only" id="mmOpen" aria-label="Menu">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="#" class="logo"><span class="logo-mk"><b>U</b></span>
      <span class="logo-tx"><b>UCP</b><i id="tagline"></i></span></a>
    <nav class="nav-c" id="nav" aria-label="Primary"></nav>
    <div class="hd-act">
      <button class="ib" id="srchOpen" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <a href="#loy" class="ib" aria-label="Loyalty">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 11h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 7h18v4H3zM12 7v14"/></svg>
      </a>
      <button class="ib" aria-label="Account">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
      </button>
      <button class="ib" id="cartBtn" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2m9 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg>
        <span class="badge" id="cnt" hidden>0</span>
      </button>
      <button id="lang" style="font-size:11px;letter-spacing:.14em;padding-inline:10px;color:var(--muted)">EN</button>

</header>

<main id="main">
  <section class="hero">
    <div class="wrap">
      <span class="lbl" id="kick"></span>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
      <div class="hero-cta">
        <a href="#pop" class="btn btn-f" id="heroB1"></a>
        <a href="#rx" class="btn btn-o" id="heroB2"></a>

      <div class="hero-rule" aria-hidden="true"></div>

  <section class="svc"><div class="wrap" id="svc"></div></section>

  <section class="sec wrap" id="cats">

    <div class="mos" id="mos"></div>

  </section>

  <section class="sec wrap" id="pop" style="padding-top:0">

    <div class="prail" id="popRail"></div>

  <section class="rx" id="rx">

        <span class="lbl" id="rxL"></span>

        <p id="rxP"></p>
        <div class="hero-cta" style="justify-content:flex-start;margin-top:26px">

  <section class="sec wrap" id="offers">

  <section class="sec wrap" style="padding-top:0">
    <div class="sec-hd"><span class="lbl" id="bnL"></span><h2 id="bnH"></h2><div class="r"></div></div>

  <section class="sec wrap" style="padding-top:0">
    <div class="sec-hd"><span class="lbl" id="brL"></span><h2 id="brH"></h2><div class="r"></div></div>

  <section class="loy" id="loy">

        <span class="lbl" id="loyL"></span>

<footer class="ft">

</footer>

<div class="ovl" id="ovl">
  <div class="ovl-h"><button class="ib" id="srchX" aria-label="Close">

</div>

<aside class="drawer" id="drawer" aria-label="Cart">

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    <button id="mmX" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="mmBody"></div>
</nav>

<div class="toast" id="toast"><span id="toastT"></span></div>

<script src="data.js"></script>
<script>
const ICONS = {
  face:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M9 10h.01M15 10h.01M8.5 14.5a4.5 4.5 0 0 0 7 0',
  hair:'M5 20v-7a7 7 0 0 1 14 0v7M5 13c1.5-1 2.5-3 2.5-5M19 13c-1.5-1-2.5-3-2.5-5',
  body:'M12 5.5a1.75 1.75 0 1 0 0-3.5 1.75 1.75 0 0 0 0 3.5M12 7v7M12 7 7.5 9M12 7l4.5 2M12 14l-2.5 8M12 14l2.5 8',
  feminine:'M12 14a5 5 0 1 0 0-10 5 5 0 0 0 0 10M12 14v7M9 18h6',
  lens:'M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9',
  oral:'M4 7c0-2 2-3 4-3s3 1 4 1 2-1 4-1 4 1 4 3c0 4-1.5 5-2.5 8S16 20 15 20s-1.5-3-3-3-2 3-3 3-1.5-2-2.5-5S4 11 4 7',
  vitamin:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 7.5v9M7.5 12h9',
  baby:'M9 9h6v10a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2zM10 9V6.5h4V9M11 6.5V4.5a1 1 0 0 1 2 0v2M9 13h6',
  device:'M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1M9 8h6M9 11.5h6M10.5 15h3',
  pill:'M10.5 3.5 3.5 10.5a5 5 0 0 0 7 7l7-7a5 5 0 0 0-7-7M7 7l7 7',
  makeup:'M9 3h6v4H9zM8 7h8l-1 13a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z',
  rx:'M7 20V5a1 1 0 0 1 1-1h5l4 4v3M7 9h6M7 13h3M14 20l6-6M20 20l-6-6',
  store:'M4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9M3 10l1.5-5a1 1 0 0 1 1-.8h13a1 1 0 0 1 1 .8L21 10a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0',
  chat:'M4 5h16v11H9l-5 4z', gift:'M3 11h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 7h18v4H3zM12 7v14',
  bell:'M6 16V10a6 6 0 1 1 12 0v6l2 3H4zM10 21h4',
};
const ic = (n,s) => '<svg width="'+(s||21)+'" height="'+(s||21)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICONS[n]+'"/></svg>';

let lang="ar", cart=[];
const $=s=>document.querySelector(s); const T=()=>UCP.copy[lang]; const nm=o=>o[lang];

function render(){
  const t=T();
  document.documentElement.lang=lang;
  document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  $("#lang").textContent = lang==="ar"?"EN":"ع";
  $("#proto").innerHTML = "<b>THEME 02 — PREMIUM</b> · " + t.proto;
  $("#tagline").textContent = t.tag;
  $("#q").placeholder = t.searchPh;

  $("#nav").innerHTML = UCP.categories.slice(0,6).map(c=>'<a href="#cats">'+nm(c)+'</a>').join("")
    + '<a href="#rx">'+t.rx+'</a>';

  $("#kick").textContent = lang==="ar" ? "صيدلية · عناية · مكمّلات" : "Pharmacy · Care · Supplements";
  $("#heroH").innerHTML = lang==="ar"
    ? 'العناية التي تختارها<br>بـ<em>عناية</em>'
    : 'The care you choose,<br><em>carefully</em>';
  $("#heroP").textContent = lang==="ar"
    ? "مجموعة مختارة من العناية والمكمّلات، مع وصفاتك الطبية — تصل إليك أو جاهزة للاستلام."
    : "A considered selection of care and supplements, alongside your prescriptions — delivered, or ready to collect.";
  $("#heroB1").textContent = t.shopNow;
  $("#heroB2").textContent = t.rx;

  $("#svc").innerHTML = [
    {i:"rx",b:t.rx,s:t.rxDesc},{i:"store",b:t.pickup,s:t.pickupDesc},{i:"chat",b:t.tele,s:t.teleDesc},
  ].map(x=>'<a href="#rx">'+ic(x.i,24)+'<span><b>'+x.b+'</b><span>'+x.s+'</span></span></a>').join("");

  // headings
  $("#catsL").textContent = lang==="ar"?"الفئات":"Categories";
  $("#catsH").textContent = t.cats; $("#catsAll").textContent = t.allCats;
  $("#popL").textContent = lang==="ar"?"مختارات":"Selected";
  $("#popH").textContent = t.popular;
  $("#offL").textContent = lang==="ar"?"عروض":"Offers";
  $("#offH").textContent = t.offers; $("#offAll").textContent = t.viewAll;
  $("#bnL").textContent = lang==="ar"?"باقات":"Packages";
  $("#bnH").textContent = t.packages;
  $("#brL").textContent = lang==="ar"?"علاماتنا":"Our brands";
  $("#brH").textContent = t.brands;

  // Editorial mosaic. Three stone tones on rotation rather than a distinct
  // pastel per category: eleven different tints read as a swatch chart, and
  // the restraint is what makes this direction feel expensive. Scale — which
  // tile is big — carries the hierarchy instead of colour.
  const sizes=["big","","","wide","","","","","","",""];
  const tones=["#EFE9E0","#E7DFD4","#F4EFE8"];
  $("#mos").innerHTML = UCP.categories.map((c,i)=>{
    const sample = UCP.products.find(p=>p.cat===c.id) || UCP.products[i%UCP.products.length];
    return '<a class="mt '+(sizes[i]||"")+'" href="#pop" style="background:'+tones[i%3]+'">'+
      '<span class="mt-art">'+productArt(sample,"premium",{transparent:true})+'</span>'+
      '<span class="mt-ico">'+ic(c.icon,24)+'</span>'+
      '<span class="mt-in"><span>'+String(i+1).padStart(2,"0")+'</span><b>'+nm(c)+'</b></span></a>';
  }).join("");

  const pop=[...UCP.products].sort((a,b)=>a.rank-b.rank).slice(0,8);
  $("#popRail").innerHTML = pop.map(card).join("");
  $("#offGrid").innerHTML = UCP.products.filter(p=>p.was).slice(0,8).map(card).join("");

  $("#pks").innerHTML = UCP.bundles.map(b=>
    '<a class="pk" href="#"><h3>'+nm(b)+'</h3><div class="pk-r"></div>'+
    '<p class="note">'+nm(b.note)+'</p>'+
    '<div class="pk-pr"><b>'+priceHTML(b.price,lang)+'</b>'+
    '<div class="pk-save">'+t.save+" "+(b.parts-b.price)+" "+t.riyal+'</div></div></a>').join("");

  $("#bgrid").innerHTML = UCP.brands.map(b=>
    '<a class="bg-i" href="#">'+brandMark(b,lang,"#1C1815")+'<span>'+nm(b)+'</span></a>').join("");

  // prescription
  $("#rxL").textContent = lang==="ar"?"خدمة صيدلية":"Pharmacy service";
  $("#rxH").textContent = t.rx; $("#rxP").textContent = t.rxDesc; $("#rxB").textContent = t.rx;
  const steps = lang==="ar"
    ? [["ارفع صورة الوصفة","من جوالك أو من ملفاتك، بصيغة صورة أو PDF."],
       ["يراجعها صيدلي مرخّص","نتحقق من الوصفة ونتواصل معك إذا احتجنا توضيحًا."],
       ["نجهّز طلبك","توصيل إلى عنوانك، أو استلام من أقرب فرع."]]
    : [["Upload your prescription","From your phone or your files, as an image or PDF."],
       ["A licensed pharmacist reviews it","We check it and contact you if anything needs clarifying."],
       ["We prepare your order","Delivered to you, or ready at your nearest branch."]];
  $("#rxSteps").innerHTML = steps.map((s,i)=>
    '<div class="rx-st"><span class="n">'+(i+1)+'</span><div><b>'+s[0]+'</b><span>'+s[1]+'</span></div></div>').join("");

  // loyalty
  const L=UCP.loyalty;
  $("#loyL").textContent = lang==="ar"?"برنامج الولاء":"Loyalty";
  $("#loyH").textContent = t.loyalty; $("#loyP").textContent = t.loyaltyDesc;
  $("#loyB").textContent = lang==="ar"?"اعرف المزيد":"Learn more";
  $("#loyBal").textContent = t.balance;
  $("#loyPts").textContent = L.points.toLocaleString("en-US");
  $("#loyTier").textContent = (lang==="ar"?L.tierAr:L.tierEn);
  $("#loyBar").style.width=(L.progress*100)+"%";
  $("#loyBar").parentElement.style.setProperty("--at",(L.progress*100)+"%");
  $("#loyNext").textContent = L.toNext+" "+t.toNext+" "+(lang==="ar"?L.nextAr:L.nextEn);

  const cols = lang==="ar"
    ? [[t.footerAbout,["من نحن","فروعنا","الوظائف","تواصل معنا"]],
       [t.footerService,["المساعدة","التوصيل","الإرجاع","الأسئلة الشائعة"]],
       [t.footerShop,["كل الفئات","العلامات التجارية","العروض","الباقات"]],
       [t.footerPharmacy,["طلب الوصفات","استشارة صيدلي","متابعة الفيتامينات","الاستلام من الفرع"]],
       [t.footerLegal,["الخصوصية","الشروط","الإرجاع","ملفات الارتباط"]]]
    : [[t.footerAbout,["About us","Our branches","Careers","Contact"]],
       [t.footerService,["Help","Delivery","Returns","FAQ"]],
       [t.footerShop,["All categories","Brands","Offers","Packages"]],
       [t.footerPharmacy,["Prescriptions","Consultation","Vitamin follow-up","Branch pickup"]],
       [t.footerLegal,["Privacy","Terms","Returns","Cookies"]]];
  $("#ftCols").innerHTML =
    '<div><div class="logo" style="margin-bottom:16px"><span class="logo-mk"><b>U</b></span>'+
    '<span class="logo-tx"><b>UCP</b></span></div>'+
    '<p style="font-size:13.5px;color:var(--muted);max-width:32ch">'+t.brand+'</p>'+
    '<p style="font-size:11px;color:var(--faint);margin-top:14px">'+t.placeholderNote+'</p></div>'+
    cols.map(c=>'<div><h3>'+c[0]+'</h3><ul>'+c[1].map(l=>'<li><a href="#">'+l+'</a></li>').join("")+'</ul></div>').join("");
  $("#ftRights").textContent = "© 2026 "+t.brand+". "+t.rights+".";

  $("#drT").textContent=t.cart; $("#drTot").textContent=t.total;
  $("#drGo").textContent=t.checkout; $("#drNote").textContent=t.vat+" · "+t.placeholderNote;
  $("#mmBody").innerHTML =
    [["rx",t.rx],["chat",t.tele],["store",t.pickup],["gift",t.loyalty],["bell",t.vitamins]]
      .map(x=>'<a href="#">'+ic(x[0],20)+'<span>'+x[1]+'</span></a>').join("")
    + UCP.categories.map(c=>'<a href="#cats">'+ic(c.icon,20)+'<span>'+nm(c)+'</span></a>').join("");
  renderCart();
}

function card(p){
  const t=T(), b=byId(UCP.brands,p.brand), off=pct(p.price,p.was);
  return '<article class="p">'+
    '<div class="p-img">'+productArt(p,"premium")+
      (off?'<span class="p-off">−'+off+'%</span>':"")+
      (p.tags.includes("low")?'<span class="p-flag">'+t.lowStock+'</span>':"")+
    '</div>'+
    '<span class="p-br">'+nm(b)+'</span>'+
    '<h3 class="p-n">'+nm(p)+'</h3>'+
    '<div class="p-pr"><b>'+priceHTML(p.price,lang)+'</b>'+(p.was?wasHTML(p.was,lang):"")+'</div>'+
    '<button class="p-add" data-add="'+p.id+'">'+t.add+'</button></article>';
}

function addToCart(id){
  const l=cart.find(x=>x.id===id); if(l)l.q++; else cart.push({id,q:1});
  renderCart(); const p=byId(UCP.products,id);
  showToast(nm(p)+" — "+T().added);
  const b=document.querySelector('[data-add="'+id+'"]');
  if(b){b.classList.add("ok");b.textContent=T().added;setTimeout(()=>{b.classList.remove("ok");b.textContent=T().add;},1600);}
}
function renderCart(){
  const t=T(), n=cart.reduce((s,l)=>s+l.q,0), c=$("#cnt");
  c.hidden=n===0; c.textContent=n;
  const total=cart.reduce((s,l)=>s+byId(UCP.products,l.id).price*l.q,0);
  $("#drSum").innerHTML=priceHTML(total,lang);
  $("#drBody").innerHTML = cart.length===0 ? '<p class="dr-empty">'+t.emptyCart+'</p>'
    : cart.map(l=>{const p=byId(UCP.products,l.id);
      return '<div class="dr-i">'+productArt(p,"premium")+
        '<div class="t"><b>'+nm(p)+'</b><span class="pr">'+priceHTML(p.price*l.q,lang)+'</span>'+
        '<div class="dr-qty"><button data-q="-1" data-id="'+l.id+'">−</button><span class="num">'+l.q+
        '</span><button data-q="1" data-id="'+l.id+'">+</button></div></div></div>';}).join("");
}
function showToast(m){$("#toastT").textContent=m;$("#toast").classList.add("on");
  clearTimeout(window._t);window._t=setTimeout(()=>$("#toast").classList.remove("on"),2200);}

/* search overlay */
$("#q").addEventListener("input",()=>{
  const s=$("#q").value.trim().toLowerCase(), t=T(), box=$("#ores");
  if(s.length<2){box.innerHTML="";return;}
  const cats=UCP.categories.filter(c=>(c.ar+c.en).toLowerCase().includes(s)).slice(0,3);
  const prods=UCP.products.filter(p=>(p.ar+p.en+byId(UCP.brands,p.brand).en).toLowerCase().includes(s)).slice(0,6);
  if(!cats.length&&!prods.length){box.innerHTML='<p style="padding:40px 0;color:var(--faint)">'+t.noResults+'</p>';return;}
  box.innerHTML =
    (cats.length?'<div class="ovl-grp"><span class="lbl">'+t.cats+'</span></div>'+cats.map(c=>
      '<a class="ores" href="#cats"><span style="width:54px;height:54px;display:grid;place-items:center;background:'+c.tint+'">'+ic(c.icon,22)+'</span><span class="t"><b>'+nm(c)+'</b></span></a>').join(""):"")+
    (prods.length?'<div class="ovl-grp"><span class="lbl">'+t.popular+'</span></div>'+prods.map(p=>
      '<a class="ores" href="#pop">'+productArt(p,"premium")+'<span class="t"><b>'+nm(p)+'</b><span>'+nm(byId(UCP.brands,p.brand))+'</span></span><span class="p">'+priceHTML(p.price,lang)+'</span></a>').join(""):"");
});

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]"); if(a){addToCart(a.dataset.add);return;}
  const q=e.target.closest("[data-q]");
  if(q){const l=cart.find(x=>x.id===q.dataset.id);
    if(l){l.q+=Number(q.dataset.q); if(l.q<=0)cart=cart.filter(x=>x!==l);} renderCart();}
});
const dr=on=>{$("#drawer").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);};
const mm=on=>{$("#mm").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);};
const ov=on=>{$("#ovl").classList.toggle("on",on); if(on)setTimeout(()=>$("#q").focus(),120);};
$("#cartBtn").onclick=()=>dr(true); $("#drX").onclick=()=>dr(false);
$("#mmOpen").onclick=()=>mm(true); $("#mmX").onclick=()=>mm(false);
$("#srchOpen").onclick=()=>ov(true); $("#srchX").onclick=()=>ov(false);
$("#scrim").onclick=()=>{dr(false);mm(false);};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){dr(false);mm(false);ov(false);}});
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render();};
$("#rxB").onclick=()=>showToast(T().rx+" — "+(lang==="ar"?"نموذج تصميم فقط":"design prototype only"));
render();
</script>
</body>
</html>
