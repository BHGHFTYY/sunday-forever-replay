<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>UCP — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editorial.css">
</head>
<body>
<div class="proto"><span><b>UCP — EDITORIAL</b> · <span id="protoTx"></span></span>
  <button id="langBtn" data-lang>EN</button></div>

<header class="hd"><div class="wrap hd-in">
  <a href="#" class="logo"><img src="ucp-logo-mark.png" alt="UCP"></a>
  <nav id="topnav"></nav>
  <div class="right">
    <a href="#" class="sbtn" id="sbtn"></a>
    <a href="#" id="cartLink"></a>
    <a href="#" id="accLink"></a>
  </div>
</div></header>

<main>
  <section class="hero">
    <div class="bg"><div class="fill" id="heroFill"></div></div>
    <div class="scrim"></div>
    <div class="floatcard" id="floatcard"></div>
    <div class="in" data-scrim-verified><div class="wrap">
      <div class="chips" id="heroChips"></div>
      <h1 id="heroH"></h1>
      <p id="heroP"></p>
      <div class="acts"><a class="go" href="#" id="heroCta"></a><a class="alt" href="#" id="heroAlt"></a></div>
    </div></div>
  </section>

  <section class="sec"><div class="wrap">
    <div class="eyebrow" id="ldEy"></div>
    <p class="lede" id="lede"></p>
  </div></section>

  <section class="sec" style="padding-top:0"><div class="wrap">
    <div class="eyebrow" id="idxEy"></div>
    <div class="index" id="index"></div>
    <div class="prow" id="prow"></div>
    <a class="allprods" href="#" id="allProds"></a>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="eyebrow" id="stEy"></div>
    <div class="story">
      <div class="storynav" id="storynav" role="tablist"></div>
      <div class="storypanel" id="storypanel"></div>
    </div>
  </div></section>
</main>

<footer class="ft"><div class="wrap">
  <div class="ft-cols" id="ftCols"></div>
  <div class="bot"><span id="ftR"></span><span id="ftN"></span></div>
</div></footer>

<script src="catalogue.js"></script>
<script src="ucp.js"></script>
<script>
/* ===========================================================================
   UCP — EDITORIAL homepage
   ---------------------------------------------------------------------------
   Running on UCP's real catalogue: 3,824 products with their own titles, SKUs
   and photographs.

   THE HONEST CAVEAT, stated where it matters rather than buried. The shot this
   is drawn from is roughly eighty percent commissioned photography — a styled
   living room behind the headline, a craftsman at his bench, real people with
   names under them. UCP's assets are supplier packshots on white. So the hero
   here composes real product photographs instead of a lifestyle scene, and
   every place the original used a portrait or a testimonial is a labelled gap,
   not an invention. Inventing a pharmacist with a name and a title, or a
   customer quote, is precisely the kind of thing a pharmacy must never ship.
   =========================================================================== */

/* --- catalogue adapter (same one the other executions use) ---------------- */
(function () {
  if (typeof CATALOGUE === "undefined") return;
  const form = (t, s) => {
    const x = (t + " " + (s || "")).toLowerCase();
    if (/lens/.test(x)) return "lens";
    if (/tab|cap|sg\b|softgel/.test(x)) return "jar";
    if (/tube|cream|gel|paste|ointment/.test(x)) return "tube";
    if (/serum|drops|ampoule|oil/.test(x)) return "dropper";
    if (/spray|deodorant|wash|shampoo|lotion/.test(x)) return "pump";
    if (/box|pack|pcs|pads|diaper|sachet/.test(x)) return "carton";
    return "bottle";
  };
  UCP.categories = CATALOGUE.categories.map((c) => ({ id:c.id, ar:c.ar, en:c.en, icon:c.icon, n:c.n }));
  UCP.brands = CATALOGUE.brands.map((b) => ({ id:b.id, ar:b.en, en:b.en, n:b.n }));
  const known = new Set(UCP.brands.map((b) => b.id));
  const bn = new Map(UCP.brands.map((b) => [b.id, b.en]));
  const strip = (t, id) => {
    const en = bn.get(id); if (!en) return t;
    const q = en.replace(/[.*+?^${}()|[\]\\]/g, (m) => "\\" + m);
    const o = t.replace(new RegExp("^" + q + "[\\s,'’-]*", "i"), "").trim();
    return o.length >= 3 ? o : t;
  };
  UCP.products = CATALOGUE.products.map((p, i) => ({
    id:"s"+p.sku, sku:p.sku, brand: known.has(p.brand) ? p.brand : null,
    cat:p.cat, title:p.title, ar:strip(p.title,p.brand), en:strip(p.title,p.brand),
    price:p.price, was:p.was, size:p.size || "", form:form(p.title,p.size),
    rank:i+1, tags:p.was?["offer"]:[], img:imgUrl(p),
  }));
})();

const BRAND = new Map(UCP.brands.map((b) => [b.id, b]));
const PROD = new Map(UCP.products.map((p) => [p.id, p]));
const $ = (s) => document.querySelector(s);
const set = (id, h) => { const e = document.getElementById(id); if (e) e.innerHTML = h; };
const esc2 = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const riyal = (n) => '<span class="num">' + n + '</span> ﷼';

function shot(p) {
  if (!p.img) return art(p, { light:true });
  return '<img src="' + p.img + '" alt="' + esc2(p.title) + '" loading="lazy" decoding="async"'
    + ' onerror="IMGFAIL(this,\'' + p.id + '\')">';
}
window.IMGFAIL = (el, id) => {
  const parent = el.parentNode; el.remove();
  const p = PROD.get(id);
  if (parent && p) parent.insertAdjacentHTML("afterbegin", art(p, { light:true }));
};

const TX = {
  ar: { proto:"الأسماء والصور من كتالوج UCP الفعلي · الأسعار تجريبية",
        nav:[["تسوّق","#"],["الأدوية","#"],["العناية","#"],["خدماتنا","#"]],
        search:"بحث", cart:"السلة", account:"حسابي",
        heroChips:["توصيل ٦٠ دقيقة","استلام من الفرع","وصفتك الطبية"],
        heroH:"صيدلية تعرف ما تحتاجه، قبل أن تسأل.",
        heroP:"أكثر من ٣٬٨٠٠ منتج، يراجعها صيادلة مرخّصون، وتصلك من أقرب فرع مفتوح.",
        heroCta:"ابدأ التسوق", heroAlt:"اطلب وصفتك",
        ldEy:"عن UCP",
        lede:"نحن صيدلية قبل أن نكون متجرًا. كل طلب يمرّ على صيدلي، وكل وصفة تُراجع قبل تجهيزها — سواء وصلتك خلال ساعة أو استلمتها من الفرع.",
        idxEy:"تصفّح حسب الفئة", allProds:"عرض كل المنتجات",
        stEy:"ما نقدّمه",
        tabs:["الوصفات الطبية","الاستشارة","التوصيل والاستلام"],
        panels:[
          [["rx","ارفع وصفتك","صوّر الوصفة وارفعها. يراجعها صيدلي مرخّص ويتواصل معك إن احتاج توضيحًا."],
           ["shield","مراجعة قبل الصرف","لا يُصرف أي دواء دون مراجعة صيدلي. هذه ليست ميزة، بل شرط."]],
          [["chat","تحدّث إلى صيدلي","محادثة أو مكالمة فيديو قبل الشراء، دون موعد."],
           ["bell","متابعة الفيتامينات","تذكير عند قرب انتهاء عبوتك، إن اخترت ذلك."]],
          [["truck","توصيل خلال ٦٠ دقيقة","للطلبات داخل الرياض من الفروع المفتوحة وقت الطلب."],
           ["store","استلام من الفرع","نجهّز الطلب وتستلمه من أقرب فرع، دون انتظار."]],
        ],
        ftShop:"التسوق", ftCare:"خدمات صيدلية", ftAbout:"عن UCP",
        rights:"جميع الحقوق محفوظة", vat:"الأسعار شاملة الضريبة",
        slotTag:"غير متوفر في هذا النموذج",
        slotH:"تصوير UCP الخاص",
        slotP:"هذا الاتجاه يعتمد على تصوير احترافي للأجواء والفريق. المتوفر حاليًا صور منتجات من المورّدين فقط، ولن نضع أسماء صيادلة أو آراء عملاء لم توجد." },
  en: { proto:"Names and photographs are UCP's real catalogue · prices are placeholder",
        nav:[["Shop","#"],["Medicines","#"],["Care","#"],["Services","#"]],
        search:"Search", cart:"Cart", account:"Account",
        heroChips:["60-minute delivery","Branch pickup","Your prescription"],
        heroH:"A pharmacy that knows what you need, before you ask.",
        heroP:"Over 3,800 products, reviewed by licensed pharmacists, delivered from the nearest open branch.",
        heroCta:"Start shopping", heroAlt:"Order a prescription",
        ldEy:"About UCP",
        lede:"We are a pharmacy before we are a shop. Every order passes a pharmacist, and every prescription is reviewed before it is prepared — whether it reaches you within the hour or you collect it yourself.",
        idxEy:"Browse by category", allProds:"See every product",
        stEy:"What we do",
        tabs:["Prescriptions","Consultation","Delivery & pickup"],
        panels:[
          [["rx","Upload your prescription","Photograph it and send it. A licensed pharmacist reviews it and contacts you if anything needs clarifying."],
           ["shield","Reviewed before dispensing","No medicine is dispensed without a pharmacist's review. That is not a feature, it is a condition."]],
          [["chat","Talk to a pharmacist","Chat or video call before you buy, without an appointment."],
           ["bell","Vitamin follow-up","A reminder when your supply runs low, if you want one."]],
          [["truck","Delivery in 60 minutes","Inside Riyadh, from branches open at the time you order."],
           ["store","Collect from a branch","We prepare it, you pick it up, no waiting."]],
        ],
        ftShop:"Shop", ftCare:"Pharmacy services", ftAbout:"About UCP",
        rights:"All rights reserved", vat:"Prices include VAT",
        slotTag:"Not in this prototype",
        slotH:"UCP's own photography",
        slotP:"This direction leans on commissioned lifestyle and team photography. What exists today is supplier packshots, and we will not put names to pharmacists or quotes to customers that do not exist." },
};
const tx = () => TX[Shell.lang];
let tab = 0;

function render() {
  const T = tx(), TT = Shell.T(), n = Shell.nm, ar = Shell.lang === "ar";
  set("protoTx", T.proto);
  document.getElementById("langBtn").textContent = ar ? "EN" : "ع";

  set("topnav", T.nav.map(([l,h]) => '<a href="'+h+'">'+l+'</a>').join(''));
  set("sbtn", ic("search",15) + ' <span>' + T.search + '</span>');
  set("cartLink", T.cart + ' (<span class="num">' + Shell.count() + '</span>)');
  set("accLink", T.account);

  const top = Shell.list("top");
  set("heroFill", top.slice(0,3).map((p) => '<span>' + shot(p) + '</span>').join(''));
  set("heroChips", T.heroChips.map((c) => '<a href="#">' + c + '</a>').join(''));
  set("heroH", T.heroH); set("heroP", T.heroP);
  $("#heroCta").textContent = T.heroCta;
  $("#heroAlt").innerHTML = T.heroAlt + ' <span aria-hidden="true">' + (ar ? "←" : "→") + '</span>';

  const f = top[0], fb = BRAND.get(f.brand);
  set("floatcard", '<span class="th">' + shot(f) + '</span><span>'
    + (fb ? '<span class="b">' + esc2(fb.en) + '</span>' : '')
    + '<span class="t">' + esc2(n(f)) + '</span>'
    + '<span class="p">' + riyal(f.price) + '</span></span>');

  set("ldEy", T.ldEy); set("lede", T.lede);

  /* The typographic index — the one element that gets better at this scale,
     because the superscripts are real counts from the catalogue. */
  set("idxEy", T.idxEy);
  set("index", UCP.categories.map((c, i) =>
    '<a href="#"' + (i === 0 ? ' class="on"' : '') + '>' + n(c)
    + '<sup class="num">' + c.n + '</sup></a>').join(''));

  set("prow", top.slice(0, 6).map((p) => {
    const b = BRAND.get(p.brand);
    return '<a class="ptile" href="#"><span class="im">' + shot(p) + '</span>'
      + (b ? '<span class="b">' + esc2(b.en) + '</span>' : '')
      + '<span class="t">' + esc2(n(p)) + '</span>'
      + '<span class="p">' + (p.was ? '<span class="dot"></span>' : '') + riyal(p.price)
      + (p.was ? '<s>' + riyal(p.was) + '</s>' : '') + '</span></a>';
  }).join(''));
  $("#allProds").innerHTML = T.allProds + ' <span class="num">(' + UCP.products.length + ')</span>';

  set("stEy", T.stEy);
  set("storynav", T.tabs.map((t, i) =>
    '<button role="tab" data-tab="' + i + '" aria-selected="' + (i === tab) + '">'
    + '<span class="dot"></span>' + t + '</button>').join(''));
  set("storypanel", T.panels[tab].map(([i, h, p]) =>
    '<div class="card"><div class="ic">' + ic(i, 24) + '</div><h3>' + h + '</h3><p>' + p + '</p></div>').join('')
    + '<div class="slot"><span class="tag">' + T.slotTag + '</span><h3>' + T.slotH + '</h3><p>' + T.slotP + '</p></div>');

  const cols = [
    [T.ftShop, UCP.categories.slice(0,5).map(n)],
    [T.ftCare, [TT.rx, TT.tele, TT.pickup, TT.vitamins]],
    [T.ftAbout, [TT.brand, ar ? "فروعنا" : "Our branches", ar ? "تواصل معنا" : "Contact"]],
  ];
  set("ftCols", '<div class="lead"><img src="ucp-logo-mark.png" alt="UCP"><p style="font-size:13px;color:var(--muted);max-width:34ch">'
      + TT.phNote + '</p></div>'
    + cols.map((c) => '<div><h4>' + c[0] + '</h4><ul>'
      + c[1].map((x) => '<li><a href="#">' + x + '</a></li>').join('') + '</ul></div>').join(''));
  set("ftR", "© " + new Date().getFullYear() + " " + TT.brand + " — " + T.rights);
  set("ftN", T.vat);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = Number(t.dataset.tab); render(); }
});

Shell.onRender(render);
Shell.wire();
Shell.setLang("ar");
</script>
</body>
</html>
